<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Open Padel · Pruebas de puntuación y voz</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 32px 18px;
      background: #070d18;
      color: #e9f0fb;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    main { max-width: 860px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -0.02em; }
    p.sub { margin: 0 0 22px; color: #93a5c0; font-size: 14px; }
    .summary {
      display: flex; gap: 12px; flex-wrap: wrap;
      margin-bottom: 18px;
    }
    .pill {
      padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 14px;
      border: 1px solid rgba(148, 163, 184, 0.22); background: #0d1728;
    }
    .pill.ok { color: #86efac; border-color: rgba(34, 197, 94, 0.45); background: rgba(34, 197, 94, 0.1); }
    .pill.ko { color: #fca5a5; border-color: rgba(239, 68, 68, 0.45); background: rgba(239, 68, 68, 0.1); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    li {
      display: flex; gap: 12px; align-items: baseline;
      padding: 11px 14px; border-radius: 10px;
      background: #0b1526; border: 1px solid rgba(148, 163, 184, 0.14);
      font-size: 13.5px;
    }
    li .mark { font-weight: 800; width: 18px; flex: none; }
    li.pass .mark { color: #4ade80; }
    li.fail { border-color: rgba(239, 68, 68, 0.5); background: rgba(127, 29, 29, 0.18); }
    li.fail .mark { color: #f87171; }
    li .detail { display: block; margin-top: 5px; color: #fca5a5; font-size: 12px; }
    .reload { margin-top: 22px; color: #6e809b; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Open Padel · Pruebas de puntuación y voz</h1>
    <p class="sub">Reglas de pádel (puntos, ventaja, punto de oro, juegos, sets y tie-break) y comandos «Punto Norte» / «Punto Sur».</p>
    <div class="summary">
      <span class="pill" id="total">— pruebas</span>
      <span class="pill ok" id="passed">0 correctas</span>
      <span class="pill ko" id="failed">0 fallidas</span>
    </div>
    <ul id="results"></ul>
    <p class="reload">Abre esta página en el navegador para ejecutar las pruebas de nuevo.</p>
  </main>

  <script src="../js/scoring.js"></script>
  <script src="../js/voice.js"></script>
  <script src="scoring-tests.js"></script>
</body>
</html>
